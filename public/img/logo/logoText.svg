<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A0522D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B4513;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C19A6B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Logo Icon -->
  <g transform="translate(0, 8)">
    <!-- Door Frame (Outer) -->
    <rect x="0" y="0" width="44" height="44" rx="5" fill="none" stroke="url(#frameGrad)" stroke-width="3"/>
    
    <!-- Door Frame (Inner) -->
    <rect x="2.5" y="2.5" width="39" height="39" rx="2" fill="none" stroke="#8B4513" stroke-width="1" opacity="0.4"/>
    
    <!-- Door -->
    <rect x="3" y="3" width="38" height="38" rx="2" fill="url(#doorGrad)"/>
    
    <!-- Door Window Frame -->
    <rect x="9" y="9" width="26" height="28" rx="2" fill="#D4A574" stroke="#8B4513" stroke-width="1.2"/>
    
    <!-- Window Glass Panels (White background - 4 panels) -->
    <rect x="11" y="11" width="11" height="12" rx="0.5" fill="#FFFFFF" opacity="0.98"/>
    <rect x="22" y="11" width="11" height="12" rx="0.5" fill="#FFFFFF" opacity="0.98"/>
    <rect x="11" y="23" width="11" height="12" rx="0.5" fill="#FFFFFF" opacity="0.98"/>
    <rect x="22" y="23" width="11" height="12" rx="0.5" fill="#FFFFFF" opacity="0.98"/>
    
    <!-- Window Cross Lines (Frame divisions) -->
    <line x1="16.5" y1="11" x2="16.5" y2="35" stroke="#D4A574" stroke-width="1.8"/>
    <line x1="27.5" y1="11" x2="27.5" y2="35" stroke="#D4A574" stroke-width="1.8"/>
    <line x1="11" y1="23" x2="33" y2="23" stroke="#D4A574" stroke-width="1.8"/>
    
    <!-- Door Handle -->
    <circle cx="36" cy="22" r="3" fill="#D4A574"/>
    <circle cx="36" cy="22" r="2" fill="#8B4513" opacity="0.3"/>
  </g>
  
  <!-- PNS DEV Text -->
  <text x="55" y="35" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#8B4513" letter-spacing="2.5">PNS</text>
  <text x="55" y="50" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#A0522D" letter-spacing="3.5">DEV</text>
</svg>
