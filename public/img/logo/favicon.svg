<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A0522D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="doorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A0522D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B4513;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGradient)"/>
  
  <!-- Door Frame (Outer) -->
  <rect x="12" y="10" width="40" height="44" rx="3" fill="none" stroke="#D4A574" stroke-width="2.5"/>
  
  <!-- Door Frame (Inner shadow) -->
  <rect x="14" y="12" width="36" height="40" rx="2" fill="none" stroke="#8B4513" stroke-width="1" opacity="0.5"/>
  
  <!-- Door -->
  <rect x="16" y="14" width="32" height="36" rx="2" fill="url(#doorGradient)"/>
  
  <!-- Door Window Frame -->
  <rect x="20" y="18" width="24" height="26" rx="1.5" fill="#D4A574" stroke="#8B4513" stroke-width="1"/>
  
  <!-- Window Glass Panels (White background to show it's a window) -->
  <rect x="22" y="20" width="10" height="11" rx="0.5" fill="#FFFFFF" opacity="0.95"/>
  <rect x="32" y="20" width="10" height="11" rx="0.5" fill="#FFFFFF" opacity="0.95"/>
  <rect x="22" y="31" width="10" height="11" rx="0.5" fill="#FFFFFF" opacity="0.95"/>
  <rect x="32" y="31" width="10" height="11" rx="0.5" fill="#FFFFFF" opacity="0.95"/>
  
  <!-- Window Cross Lines (Frame) -->
  <line x1="27" y1="20" x2="27" y2="42" stroke="#D4A574" stroke-width="1.5"/>
  <line x1="37" y1="20" x2="37" y2="42" stroke="#D4A574" stroke-width="1.5"/>
  <line x1="22" y1="31" x2="42" y2="31" stroke="#D4A574" stroke-width="1.5"/>
  
  <!-- Door Handle -->
  <circle cx="44" cy="32" r="2.5" fill="#D4A574"/>
  <circle cx="44" cy="32" r="1.5" fill="#8B4513" opacity="0.3"/>
  
  <!-- PNS Text -->
  <text x="32" y="58" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#D4A574" text-anchor="middle" letter-spacing="1.5">PNS</text>
</svg>
