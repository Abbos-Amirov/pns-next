<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- White Background (no grid) -->
  <rect width="64" height="64" fill="#FFFFFF"/>
  
  <!-- Logo in copper-brown color (#D4A574) -->
  <g transform="translate(6, 6)" fill="none" stroke="#D4A574" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Section - House/Building -->
    <!-- Triangular roof -->
    <path d="M 4 20 L 20 4 L 36 20"/>
    
    <!-- House body rectangle -->
    <rect x="4" y="20" width="32" height="24" fill="none"/>
    
    <!-- Grid inside house (2x2 windows) - vertical line -->
    <line x1="20" y1="20" x2="20" y2="44"/>
    <!-- Horizontal line -->
    <line x1="4" y1="32" x2="36" y2="32"/>
    
    <!-- Bottom left sharp angle -->
    <path d="M 4 44 L 12 44 L 4 52"/>
    
    <!-- Right Section - Fish/Animal Head -->
    <!-- Top diagonal line (from house to fish head) -->
    <path d="M 36 20 L 48 12"/>
    
    <!-- Bottom diagonal line (from house to fish head) -->
    <path d="M 36 44 L 48 40"/>
    
    <!-- Fish eye (filled circle) -->
    <circle cx="44" cy="24" r="2.5" fill="#D4A574"/>
    
    <!-- Bottom Detail - 2x2 grid squares (chimney/foundation) -->
    <g transform="translate(14, 52)">
      <rect x="0" y="0" width="3" height="3" fill="#D4A574"/>
      <rect x="5" y="0" width="3" height="3" fill="#D4A574"/>
      <rect x="0" y="5" width="3" height="3" fill="#D4A574"/>
      <rect x="5" y="5" width="3" height="3" fill="#D4A574"/>
    </g>
  </g>
</svg>
