<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="whiteDoorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#F5F5F5;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="whiteFrameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8E8E8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Logo Icon -->
  <g transform="translate(0, 8)">
    <!-- Door Frame (Outer) -->
    <rect x="0" y="0" width="44" height="44" rx="5" fill="none" stroke="url(#whiteFrameGrad)" stroke-width="3"/>
    
    <!-- Door Frame (Inner) -->
    <rect x="2.5" y="2.5" width="39" height="39" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
    
    <!-- Door -->
    <rect x="3" y="3" width="38" height="38" rx="2" fill="url(#whiteDoorGrad)"/>
    
    <!-- Door Window Frame -->
    <rect x="9" y="9" width="26" height="28" rx="2" fill="#FFFFFF" stroke="#8B4513" stroke-width="1.2" opacity="0.3"/>
    
    <!-- Window Glass Panels (White background - 4 panels, slightly darker to show it's a window) -->
    <rect x="11" y="11" width="11" height="12" rx="0.5" fill="#FFFFFF" opacity="0.85"/>
    <rect x="22" y="11" width="11" height="12" rx="0.5" fill="#FFFFFF" opacity="0.85"/>
    <rect x="11" y="23" width="11" height="12" rx="0.5" fill="#FFFFFF" opacity="0.85"/>
    <rect x="22" y="23" width="11" height="12" rx="0.5" fill="#FFFFFF" opacity="0.85"/>
    
    <!-- Window Cross Lines (Frame divisions) - darker to show window structure -->
    <line x1="16.5" y1="11" x2="16.5" y2="35" stroke="#8B4513" stroke-width="1.8" opacity="0.4"/>
    <line x1="27.5" y1="11" x2="27.5" y2="35" stroke="#8B4513" stroke-width="1.8" opacity="0.4"/>
    <line x1="11" y1="23" x2="33" y2="23" stroke="#8B4513" stroke-width="1.8" opacity="0.4"/>
    
    <!-- Door Handle -->
    <circle cx="36" cy="22" r="3" fill="#FFFFFF"/>
    <circle cx="36" cy="22" r="2" fill="#8B4513" opacity="0.2"/>
  </g>
  
  <!-- PNS DEV Text -->
  <text x="55" y="35" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" letter-spacing="2.5">PNS</text>
  <text x="55" y="50" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" opacity="0.95" letter-spacing="3.5">DEV</text>
</svg>
